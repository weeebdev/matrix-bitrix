# Portal URL pre-filled in the login form, e.g. https://portal.example.com
default_portal_url: ""
# How many recent chats to sync (create rooms for) when connecting.
initial_chat_limit: 30
# Group chats with more members than this don't sync their member list up front; members show
# up as they post. Syncing members is slow (several Matrix requests per member) and blocks the chat.
max_member_sync: 50
# How far back the backfill queue fetches older history, in days (-1 for no limit). Needs
# backfill.queue enabled with max_batches other than 0 in the bridge config. Each batch is one
# request to the portal, spaced by backfill.queue.batch_delay.
backfill_max_days: 365
